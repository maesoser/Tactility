general.vendor=LilyGO
general.name=T-Deck Pro
# V1.1 support is new; e-paper refresh behaviour may need tuning.
general.incubating=false

hardware.target=ESP32S3
hardware.flashSize=16MB
hardware.flashMode=DIO
hardware.spiRam=true
hardware.spiRamMode=AUTO
hardware.spiRamSpeed=80M
hardware.tinyUsbMsc=true
hardware.esptoolFlashFreq=80M
hardware.bluetooth=true

storage.userDataLocation=SD

display.size=3.1"
display.dpi=128

lvgl.colorDepth=8
lvgl.theme=Mono

sdkconfig.CONFIG_CODEC_DUMMY_SUPPORT=y

cdn.infoMessage=To put the device into bootloader mode: <br/>1. Press and hold the BOOT key (GPIO0),<br/>2. Press and release the reset button,<br/>3. Release the BOOT key.
cdn.warningMessage=For T-Deck Pro hardware revision 1.1 (PCM5102A audio / CST3530 touch). Earlier revisions are not supported by this build.
